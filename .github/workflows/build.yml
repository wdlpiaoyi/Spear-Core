name: build

on:
  push:
    branches: [ "1.20.1-forge" ]
  pull_request:
    branches: [ "1.20.1-forge" ]

jobs:
  gametest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile
        run: |
          chmod +x gradlew
          ./gradlew compileJava --console=plain
      - name: GameTest
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log
      - name: Verify GameTest log
        if: always()
        run: |
          if ! grep -q "required tests passed" gametest.log; then
            echo "GameTest did not report success"
            tail -n 200 gametest.log
            exit 1
          fi
