plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '3.2.0.1'
group = 'net.minecraft.spearcore'
archivesBaseName = 'spearcore-1.20.1-forge'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        client {
        }

        server {
        }

        gameTestServer {
            // 注意：ForgeGradle 6 没有 forceExit（那是 FG5 的写法），判定以日志里的
            // "All N required tests passed :)" / "N required tests failed :(" 为准。
            jvmArgs '-Xmx2G'
            property 'forge.enabledGameTestNamespaces', 'spearcore'
        }

        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                spearcore {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    // KubeJS / Rhino 的发布仓库（仅用于编译与开发期联调）
    maven {
        name = 'latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    // KubeJS 的传递依赖 animated-gif-lib-for-java 只发布在 JitPack
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    // KubeJS 1.20.1 依赖 architectury
    maven {
        name = 'architectury'
        url = 'https://maven.architectury.dev/'
    }
    // Punchy 等 mod 的 Modrinth 发布仓库（用坐标而不是本地 libs/ jar，克隆下来就能构建）
    maven {
        name = 'modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

configurations {
    // 只用于"打进发布 jar"的依赖（不参与编译传递）
    embed
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // Mixin 注解处理器：生成 refmap（1.20.1 的 Mixin 靠它把注入目标映射到混淆名）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // ===== MixinExtras =====
    // @WrapOperation / @ModifyExpressionValue 等"可叠加"注入，避免和别的模组抢同一个注入点。
    // 1.21.1 由 NeoForge 自带；1.20.1 的 Forge 不带，所以这里内嵌进 jar（jarJar）。
    // 注解处理器：为 MixinExtras 的注入器（@WrapOperation 等）生成 refmap 映射，
    // 少了这一步，生产环境里 @At 的目标字段名不会被重映射，注入会静默失效。
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    // 运行时：Forge 1.20.1 不自带 MixinExtras。
    // 开发期（runClient / GameTestServer）需要它在 classpath 上，发布包里靠下面的 shading 内嵌。
    implementation 'io.github.llamalad7:mixinextras-forge:[0.4.1,)'
    // 只用于"打进发布 jar"：
    // mixinextras-forge 只是 Forge 适配层（含 MixinExtrasConfigPlugin + 初始化 mixin 配置），
    // 真正的库在它的 META-INF/jars/MixinExtras-*.jar 里（嵌套 jar，shading 不会展开），
    // 所以这里直接把 mixinextras-common 也并进来。
    embed 'io.github.llamalad7:mixinextras-forge:[0.4.1,)'
    embed 'io.github.llamalad7:mixinextras-common:0.5.5'

    // ===== KubeJS 联动（mods.toml 里声明为 optional）=====
    // compileOnly：只有 compat.kubejs 包编译它，绝不进发布 jar；
    //   没装 KubeJS 时那个包永远不会被加载（靠 kubejs.plugins.txt 的反射入口隔离）。
    compileOnly 'dev.latvian.mods:kubejs-forge:2001.6.5-build.26'
    // 运行期必须用 fg.deobf 反混淆版：KubeJS 的 mixin 直接写了 SRG 名（@Shadow m_7038_），
    //   而开发环境目标是 Mojang 名，不重写常量池它自己的 mixin 会崩。
    //   fg.deobf 不带传递依赖，所以 rhino / architectury 要单独列（版本取自
    //   gradlew dependencies --configuration runtimeClasspath）。
    //   要验证"没装 KubeJS"的启动路径，把这三行注释掉即可（已实测：零 ClassNotFound）。
    runtimeOnly fg.deobf('dev.latvian.mods:kubejs-forge:2001.6.5-build.26')
    runtimeOnly fg.deobf('dev.latvian.mods:rhino-forge:2001.2.2-build.17')
    runtimeOnly fg.deobf('dev.architectury:architectury-forge:9.1.12')

    // ===== Punchy 联动（可选依赖）=====
    // mixin 目标是用字符串写的，但 Mixin 注解处理器需要 Punchy 在 classpath 上才能校验目标类。
    // OOYVGbHo = Punchy 2.8d 的 1.20.1-fabric/forge 里的 forge 构建版本 id。
    compileOnly 'maven.modrinth:punchy-fpa:OOYVGbHo'
}

mixin {
    add sourceSets.main, 'mixins.spearcore.refmap.json'
    config 'spearcore.mixins.json'
    // Punchy 的阶段软桥接：没装 Punchy 时由插件判定跳过，配置 required=false，
    // 目标类缺失也不会崩。1.20.1 靠这些 config 写进 MANIFEST 的 MixinConfigs
    //（NeoForge 那边是 mods.toml 里的第二个 [[mixins]]）。
    config 'spearcore.punchy.mixins.json'
    // MixinExtras 内嵌后需要它自己的初始化 mixin（由 shading 带进 jar）。
    // 不注册这个 config，@WrapOperation 的注入器不会被注册，运行期会报 unknown injector。
    config 'mixinextras.init.mixins.json'
    quiet
}

// Punchy 是客户端专用 mod，只挂到客户端联调用的运行期 classpath，避免服务端启动时加载它。
// 必须 fg.deobf：Punchy 也是按 SRG 名编译的（Component.m_237113_ / @Shadow m_90581_ 之类），
// 开发环境目标是 Mojang 名，不反混淆它自己在开发环境就崩。
configurations { punchyClient }
dependencies {
    punchyClient fg.deobf('maven.modrinth:punchy-fpa:OOYVGbHo')
}
tasks.matching { it.name == 'runClient' }.configureEach {
    classpath += configurations.punchyClient
}

// 把仓库里的测试结构拷进 run/，保证运行可复现
tasks.register('stageGameTestStructures', Copy) {
    from 'gameteststructures'
    into 'run/gameteststructures'
}

// 注意：不能用 tasks.named('runGameTestServer')——ForgeGradle 在 minecraft{} 之后才创建这些 run 任务
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'stageGameTestStructures'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Forge 1.20.1 生产环境用的是 SRG 名（m_xxxxx_），开发/GameTest 用的是 Mojmap 名。
// 少了重混淆这一步，jar 在开发环境一切正常，进真实游戏就会 NoSuchFieldError / NoSuchMethodError
// （实测：增量构建时 reobfJar 会被判定为最新而跳过，最终 jar 又是 Mojmap 名）。
// 用 finalizedBy 锁死顺序：每次 jar 跑完都必定重混淆一遍。
tasks.named('jar') {
    finalizedBy 'reobfJar'
}


// 把 embed 里的库（MixinExtras）直接并进发布 jar。
// 用 shading 而不是 FG6 的 jarJar：那个任务在这个工程里跑完不产出合并 jar。
// 多个模组各带一份 MixinExtras 是它本身支持的做法（0.2+ 都支持字段级注入）。
jar {
    from { configurations.embed.collect { zipTree(it) } }
    // 排除适配层里那个嵌套 jar（类已经由 mixinextras-common 直接并进来了，留着只是白占 600KB）
    exclude 'META-INF/jars/MixinExtras-*.jar'
    // 两个 jar 都有 LICENSE_MixinExtras，取第一份即可
    duplicatesStrategy = org.gradle.api.file.DuplicatesStrategy.EXCLUDE
}