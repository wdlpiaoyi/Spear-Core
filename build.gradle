plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '3.2.0'
base.archivesName = "spearcore-1.21.1-neo"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    punchyClient
}

neoForge {
    version = "21.1.217"

    runs {
        client {
            client()
            // Punchy 是客户端专用 mod：只挂到客户端 run 的 classpath，
            // 否则 GameTestServer（专用服务端）会在加载它时崩
            // （Attempted to load class net/minecraft/client/gui/screens/Screen for invalid dist DEDICATED_SERVER）。
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create(files('libs/punchy-2.6.2-neoforge-1.21.1.jar')))
            // Epic Fight 是可选的联动目标：开发期想实机看效果就挂到客户端 run。
            // 不挂到 GameTestServer —— 那边不需要它，也免得拖慢测试。
            additionalRuntimeClasspathConfiguration.dependencies.add(
                    project.dependencies.create(files('libs/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')))

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }
        // GameTest：NeoForge userdev 的 run 类型里有 gameTestServer（MDG 没有内置的 gameTestServer()
        // 方法，RunModel 只有 client/server/data），所以显式写 type。
        // 判定与 1.20.1 一样看日志里的 "All N required tests passed :)" / "N required tests failed :("。
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'spearcore'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }

}

// GameTest 的模板结构：runGameTestServer 的工作目录是 run/，
// 模板必须落在 run/gameteststructures/ 下（StructureUtils 的 testStructuresDir 默认值）。
// 注意用 matching 而不是 named：run 任务由 MDG 在评估后创建，named 会在配置期直接失败。
tasks.register('stageGameTestStructures', Copy) {
    from 'gameteststructures'
    into 'run/gameteststructures'
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'stageGameTestStructures'
}
repositories {
    // KubeJS / Rhino 的发布仓库（仅用于编译与开发期联调）
    maven {
        name = 'latvian'
        url = 'https://maven.latvian.dev/releases'
    }
    // KubeJS 的运行期传递依赖 animated-gif-lib-for-java 只发布在 JitPack
    maven {
        name = 'jitpack'
        url = 'https://jitpack.io'
    }
    // Epic Fight（可选联动：复用它的 SPEAR 武器体系）：走 Modrinth 的 maven 代理
    maven {
        name = 'modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}
dependencies {
    // Punchy 联动（可选依赖）：编译期需要它在 classpath 上（mixin 注解处理器要校验目标类），
    // 运行期只有客户端需要，所以单独放 punchyClient 配置，由上面的 client run 挂载。
    compileOnly files('libs/punchy-2.6.2-neoforge-1.21.1.jar')
    punchyClient files('libs/punchy-2.6.2-neoforge-1.21.1.jar')

    // KubeJS 联动（mods.toml 中声明为 optional）。
    // compileOnly：编译 compat.kubejs 包用，绝不进入发布 jar；
    // runtimeOnly：开发期让 KubeJS 真的加载起来，便于联调。
    // 要验证"没装 KubeJS"的启动路径，把 runtimeOnly 这行注释掉即可。
    compileOnly 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.379'
    runtimeOnly 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.379'

    // Epic Fight（可选依赖，仅编译期）：复用它的 WeaponTypes.SPEAR 武器体系。
    // 用 libs/ 里的本地 jar 而不是远程坐标：这台机器连不上 maven.neoforged.net，
    // 远程解析会因该仓库被拒而整体失败；jar 与 Punchy 一样放 libs/。
    compileOnly files('libs/epic-fight-21.17.3.1-mc1.21.1-neoforge.jar')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

apply from: 'mcreator.gradle'